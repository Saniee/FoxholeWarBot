# Self-hosted deployment. See specs/postgres.md.
#
# The named volume `fwb_db` is what makes guild settings and schedules durable:
# `docker compose down` keeps it, `docker compose down -v` DESTROYS it. Never run
# the latter unless you intend to wipe the database.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: foxhole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: foxholewarbot
    volumes:
      - fwb_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxhole -d foxholewarbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides the .env DATABASE_URL: inside the compose network the host is
      # the `db` service, not localhost.
      DATABASE_URL: postgres://foxhole:${POSTGRES_PASSWORD}@db:5432/foxholewarbot
      TOKEN: ${TOKEN}
      APP_ID: ${APP_ID}
      GUILD_ID: ${GUILD_ID}
      REQUESTS_CHANNEL_ID: ${REQUESTS_CHANNEL_ID:-}
      REVIEWER_IDS: ${REVIEWER_IDS}
      # Logging. The defaults are in `utils::logging`; these only exist so the
      # host can override them without rebuilding the image. LOG_DIR is fixed to
      # the mount point below — pointing it elsewhere writes logs into the
      # container's own filesystem, where the next deploy removes them.
      LOG_DIR: /app/logs
      RUST_LOG: ${RUST_LOG:-}
      LOG_FILE_FILTER: ${LOG_FILE_FILTER:-}
      LOG_VERBOSE_FILTER: ${LOG_VERBOSE_FILTER:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
    volumes:
      - fwb_cache:/app/cache
      # Named volume, so logs survive `docker compose up --build`. Note that
      # this means they are NOT in ./logs on the host — that directory belongs
      # to a local `cargo run`, and stays empty while the bot runs here. To put
      # them beside this file instead, copy compose.override.example.yaml to
      # compose.override.yaml, which swaps this for a bind mount. Either way the
      # bot prunes them to LOG_RETENTION_DAYS.
      - fwb_logs:/app/logs

volumes:
  fwb_db:
  fwb_cache:
  fwb_logs:
