[package]
name = "FoxholeWarBot"
version = "2.1.1"
edition = "2021"

[dependencies]
ab_glyph = "0.2.29"
chrono = "0.4.39"
# The IANA database chrono itself doesn't ship. Storing an offset instead would
# be wrong for half the year (specs/schedule-input.md).
chrono-tz = "0.10"
clap = { version = "4.5.31", features = ["derive"] }
# The cron parser tokio-cron-scheduler already uses internally. Taken as a direct
# dependency so the fire-time preview is computed by the same parser that runs
# the job — a preview from a different implementation is a guess.
croner = "2.0.5"
dotenv = "0.15.0"
# `RUST_LOG` syntax, parsed the same way env_logger parses it — the crate it was
# extracted from. Kept so the filter strings in `utils::logging` mean exactly
# what they meant when env_logger was reading them.
env_filter = "0.1"
# Three sinks from one facade: a quiet console and two date-rotated files
# (`utils::logging`). env_logger writes to one target, which is what made the
# console and the record of what happened the same stream.
fern = { version = "0.7", features = ["date-based"] }
image = { version = "0.25.5", features = ["serde"] }
imageproc = "0.25.0"
log = "0.4.25"
poise = "0.6.1"
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
serenity = "0.12.4"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "migrate", "macros"] }
thiserror = "2.0.12"
tokio = { version = "1.43.0", features = ["full"] }
tokio-cron-scheduler = { version = "0.13.0", features = ["english", "signal"] }
uuid = "1.16.0"
